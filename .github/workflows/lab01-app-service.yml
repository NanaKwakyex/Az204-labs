name: Lab 01 — App Service

on:
  push:
    branches: ["lab/01-qpp-service-deploy"]
    paths:
      - "01-app-service/**"
      - ".github/workflows/lab01-app-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "01-app-service/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

env:
  RESOURCE_GROUP: rg-az204-lab01
  LOCATION: eastus2
  NAME_SUFFIX: ${{ secrets.LAB_NAME_SUFFIX }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # ── 1. Validate Bicep ─────────────────────────────────────
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bicep Lint
        run: az bicep build --file 01-app-service/infra/main.bicep

      - name: Create Resource Group
        run: |
          az group create \
            --name     ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --tags     lab=01 environment=${{ env.ENVIRONMENT }}

      - name: What-if (dry run)
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file  01-app-service/infra/main.bicep \
            --parameters \
                environment=${{ env.ENVIRONMENT }} \
                nameSuffix=${{ env.NAME_SUFFIX }}

  # ── 2. Provision Infrastructure ───────────────────────────
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name     ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --tags     lab=01 environment=${{ env.ENVIRONMENT }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file  01-app-service/infra/main.bicep \
            --parameters \
                environment=${{ env.ENVIRONMENT }} \
                nameSuffix=${{ env.NAME_SUFFIX }}

      - name: Confirm deployed resources
        run: |
          az resource list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output table

  # ── 3. Deploy App to Staging Slot ─────────────────────────
  deploy-staging:
    name: Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r 01-app-service/src/requirements.txt

      - name: Create deployment package
        run: |
          cd 01-app-service/src
          zip -r ../../deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get web app name from Azure
        id: get-app
        run: |
          WEB_APP_NAME=$(az webapp list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" \
            --output tsv)
          echo "✅ Found app: $WEB_APP_NAME"
          echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.get-app.outputs.webAppName }}
          slot-name: staging
          package: deploy.zip

      - name: Smoke test staging
        run: |
          WEB_APP_NAME="${{ steps.get-app.outputs.webAppName }}"
          STAGING_URL="https://${WEB_APP_NAME}-staging.azurewebsites.net"
          echo "Testing $STAGING_URL/health ..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health")
            echo "Attempt $i — HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done
          [ "$STATUS" = "200" ] || (echo "Staging health check failed" && exit 1)

  # ── 4. Swap Staging → Production ──────────────────────────
  swap:
    name: Swap Staging → Production
    runs-on: ubuntu-latest
    needs: [infra, deploy-staging]
    environment:
      name: production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get web app name from Azure
        id: get-app
        run: |
          WEB_APP_NAME=$(az webapp list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" \
            --output tsv)
          echo "✅ Found app: $WEB_APP_NAME"
          echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT

      - name: Swap slots
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name           ${{ steps.get-app.outputs.webAppName }} \
            --slot           staging \
            --target-slot    production

      - name: Smoke test production
        run: |
          WEB_APP_NAME="${{ steps.get-app.outputs.webAppName }}"
          PROD_URL="https://${WEB_APP_NAME}.azurewebsites.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health")
          echo "Production health — HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "Production health check failed" && exit 1)

      - name: Print URLs
        run: |
          WEB_APP_NAME="${{ steps.get-app.outputs.webAppName }}"
          echo "✅ Production: https://${WEB_APP_NAME}.azurewebsites.net"
          echo "✅ Staging:    https://${WEB_APP_NAME}-staging.azurewebsites.net"
